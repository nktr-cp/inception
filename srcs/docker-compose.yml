version: "3.8"

services:
  mariadb:
    image: mariadb
    container_name: mariadb
    build: ./requirements/mariadb
    volumes:
      - mariadb:/var/lib/mysql
    env_file:
      - .env
    networks:
      - inception
    restart: always
    secrets:
      - db_user_password
      - db_root_password

  nginx:
    image: nginx
    container_name: nginx
    build: ./requirements/nginx
    ports:
      - "443:443"
    depends_on:
      - wordpress
    volumes:
      - wordpress:/var/www/html
    env_file:
      - .env
    networks:
      - inception
    restart: always
    secrets:
      - credentials

  wordpress:
    image: wordpress
    container_name: wordpress
    build: ./requirements/wordpress
    # depends_on:
    #   mariadb
    volumes:
      - wordpress:/var/www/html
    env_file :
      - .env
    networks:
      - inception
    restart: always
    secrets:
      - db_user_password
      - wp_admin_password
      - wp_user_password

#### Note: device must be changed when submitting
volumes:
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      device: ./mdb
      o : bind
      type : none
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      device: ./wp
      o : bind
      type : none

networks:
  inception:
    name: inception

secrets:
  db_user_password:
    file: ../secrets/db_user_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  credentials:
    file: ../secrets/credentials.txt